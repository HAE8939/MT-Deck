[package]
name = "mt-deck"
version = "2.1.0"
description = "A beautiful, local-first AI prompt deck"
authors = ["HAE"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
notify = "7"
trash = "5"
walkdir = "2"

[profile.release]
codegen-units = 16
lto = false
